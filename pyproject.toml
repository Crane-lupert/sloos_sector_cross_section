[project]
name = "sloos-sector-cross-section"
version = "0.0.1"
description = "S1 — Fed SLOOS C&I lending standard tightening shock event × 11 GICS sector cross-section forward CAR. QR Scout discovery alpha-research (Macro/Credit pod first)."
requires-python = ">=3.11"
dependencies = [
  "fredapi>=0.5",
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "requests>=2.31",
  "duckdb>=1.5.2",
  "pyarrow>=14.0",
  "python-dotenv>=1.0",
  "beautifulsoup4>=4.12",
  "tabula-py>=2.9",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.1",
  "mypy>=1.7",
  "jupyter>=1.0",
  "ipykernel>=6.27",
  "streamlit>=1.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sloos_sector_cross_section"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
